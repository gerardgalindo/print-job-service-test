services:
  app1:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: printservice
      DB_USER: printservice
      DB_PASSWORD: printservice
    depends_on:
      postgres:
        condition: service_healthy

  app2:
    build: .
    ports:
      - "8081:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: printservice
      DB_USER: printservice
      DB_PASSWORD: printservice
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    volumes:
      - postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_DB: printservice
      POSTGRES_USER: printservice
      POSTGRES_PASSWORD: printservice
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U printservice -d printservice"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data: